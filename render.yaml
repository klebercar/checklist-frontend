services:
  - type: web
    name: checklist-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://checklist-backend-q3dx.onrender.com
